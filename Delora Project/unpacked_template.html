:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
