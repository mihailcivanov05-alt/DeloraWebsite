:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */
  --color-muted:           #6B7280;   /* secondary text, muted labels */
  --color-muted-soft:      #A8A2AE;   /* tertiary text */
  --color-hairline:        rgba(91, 58, 122, 0.08); /* divider lines */
  --color-hairline-strong: rgba(91, 58, 122, 0.16);

  /* ----------------------------------------------------------------
     COLOR — Semantic / UI
     ---------------------------------------------------------------- */
  --color-bg:              var(--color-cream);
  --color-fg:              var(--color-charcoal);
  --color-fg-1:            var(--color-charcoal);   /* primary text */
  --color-fg-2:            var(--color-muted);      /* secondary text */
  --color-fg-3:            var(--color-muted-soft); /* tertiary text */
  --color-fg-on-dark:      var(--color-white);
  --color-link:            var(--color-amethyst);
  --color-link-hover:      var(--color-charcoal);

  --color-success:         #10B981;   /* verified-purchase green */
  --color-warning:         #F59E0B;   /* star ratings, badges */
  --color-rating:          #D4A017;   /* deeper editorial gold for stars */
  --color-danger:          #B3261E;
  --color-info:            var(--color-amethyst);

  /* ----------------------------------------------------------------
     SURFACES & ELEVATION
     ---------------------------------------------------------------- */
  --surface-1:             var(--color-cream);          /* page */
  --surface-2:             var(--color-white);          /* cards */
  --surface-3:             var(--color-soft-white);     /* nested / alt cards */
  --surface-tint:          var(--color-lavender-soft);  /* tinted highlight */
  --surface-dark:          var(--color-charcoal);       /* footer, dark sections */

  --glass-bg:              rgba(255, 255, 255, 0.8);
  --glass-bg-dark:         rgba(31, 27, 36, 0.7);
  --glass-blur:            blur(12px);

  /* ----------------------------------------------------------------
     SHADOWS — soft, low-saturation, tinted with amethyst
     ---------------------------------------------------------------- */
  --shadow-xs:    0 1px 2px rgba(91, 58, 122, 0.04);
  --shadow-sm:    0 2px 8px rgba(91, 58, 122, 0.04);
  --shadow-md:    0 10px 30px rgba(91, 58, 122, 0.05);   /* "soft" — system default */
  --shadow-lg:    0 15px 40px rgba(91, 58, 122, 0.10);   /* card hover */
  --shadow-xl:    0 20px 50px rgba(91, 58, 122, 0.14);   /* featured */
  --shadow-cta:   0 4px 15px rgba(91, 58, 122, 0.20);    /* primary buttons rest */
  --shadow-cta-h: 0 8px 25px rgba(91, 58, 122, 0.30);    /* primary buttons hover */
  --shadow-bottom-bar: 0 -4px 20px rgba(0, 0, 0, 0.08);  /* sticky cart bar */

  /* ----------------------------------------------------------------
     RADII — generous, pill-heavy. Buttons are 50px pills.
     ---------------------------------------------------------------- */
  --radius-xs:     6px;
  --radius-sm:     10px;
  --radius-md:     12px;     /* default card */
  --radius-lg:     16px;     /* review cards, modals */
  --radius-xl:     20px;     /* hero images */
  --radius-2xl:    30px;     /* large editorial frames */
  --radius-pill:   50px;     /* buttons, chips, badges */
  --radius-full:   9999px;   /* circular icon wells */

  /* ----------------------------------------------------------------
     SPACING — 4px base. Use named tokens, not magic numbers.
     ---------------------------------------------------------------- */
  --space-0:    0;
  --space-1:    4px;        /* xs */
  --space-2:    8px;        /* sm */
  --space-3:    12px;
  --space-4:    16px;       /* md — standard padding */
  --space-5:    20px;
  --space-6:    24px;       /* lg — section padding */
  --space-8:    32px;       /* xl — large gaps */
  --space-10:   40px;
  --space-12:   48px;       /* 2xl — section margins */
  --space-16:   64px;       /* 3xl — hero padding */
  --space-20:   80px;
  --space-24:   96px;
  --space-32:   128px;      /* large desktop section spacing */

  /* ----------------------------------------------------------------
     LAYOUT
     ---------------------------------------------------------------- */
  --container-max:   1200px;
  --container-narrow: 800px;
  --container-pad:   24px;
  --header-h:        80px;
  --header-h-scrolled: 70px;

  /* ----------------------------------------------------------------
     BORDERS
     ---------------------------------------------------------------- */
  --border-hairline:  1px solid var(--color-hairline);
  --border-subtle:    1px solid var(--color-hairline-strong);
  --border-amethyst:  1px solid var(--color-amethyst);
  --border-dashed:    1px dashed rgba(91, 58, 122, 0.25);

  /* ----------------------------------------------------------------
     MOTION
     ---------------------------------------------------------------- */
  --ease-out-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:        150ms;
  --dur-base:        300ms;
  --dur-slow:        500ms;
  --transition-smooth: color, background-color, border-color, box-shadow, transform, opacity 0.3s var(--ease-out-soft);

  /* ----------------------------------------------------------------
     TYPOGRAPHY — Cormorant Garamond (display/serif) + Nunito Sans (body/UI)
     ---------------------------------------------------------------- */
  --font-heading:  "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Times New Roman", serif;
  --font-body:     "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Type scale — fluid-ish. Hero headings are large (2.5rem→3.5rem). */
  --fs-xs:    0.75rem;    /* 12 — tiny labels */
  --fs-sm:    0.85rem;    /* 13.6 — UI small */
  --fs-base:  1rem;       /* 16 — body */
  --fs-md:    1.125rem;   /* 18 — emphasized body */
  --fs-lg:    1.25rem;    /* 20 — small heading */
  --fs-xl:    1.5rem;     /* 24 — h4 */
  --fs-2xl:   2rem;       /* 32 — h3 / mobile h1 */
  --fs-3xl:   2.5rem;     /* 40 — h2 */
  --fs-4xl:   3rem;       /* 48 — section title */
  --fs-5xl:   3.5rem;     /* 56 — display */
  --fs-6xl:   4.5rem;     /* 72 — hero display */

  /* Tracking — serifs sit tight, all-caps eyebrows wide */
  --tracking-tight:   -0.02em;
  --tracking-snug:    -0.01em;
  --tracking-normal:   0em;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;   /* footer eyebrow style */

  /* Leading */
  --lh-tight:   1.15;
  --lh-snug:    1.2;
  --lh-base:    1.6;
  --lh-relaxed: 1.7;
}

/* ============================================================================
   Base reset + element defaults — semantic, opinionated.
   ============================================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: var(--lh-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Headings — Cormorant, 600 default, tight tracking ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--color-fg-1);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0;
}

h1, .h1 {
  font-size: clamp(var(--fs-3xl), 4vw + 1rem, var(--fs-6xl));
  font-weight: 500;
}
h2, .h2 {
  font-size: clamp(var(--fs-2xl), 3vw + 0.5rem, var(--fs-5xl));
  font-weight: 600;
}
h3, .h3 {
  font-size: clamp(var(--fs-xl), 2vw + 0.5rem, var(--fs-3xl));
  font-weight: 600;
}
h4, .h4 {
  font-size: var(--fs-xl);
  font-weight: 600;
}
h5, .h5 {
  font-size: var(--fs-lg);
  font-weight: 600;
}
h6, .h6 {
  font-size: var(--fs-md);
  font-weight: 600;
}

/* ---- Display & editorial helpers ---- */
.display {
  font-family: var(--font-heading);
  font-weight: 300;          /* light cormorant for editorial */
  font-size: clamp(var(--fs-4xl), 6vw, var(--fs-6xl));
  line-height: 1.05;
  letter-spacing: var(--tracking-tight);
}
.display-italic {
  font-family: var(--font-heading);
  font-style: italic;
  font-weight: 400;
}

/* ---- Eyebrow / overline (Nunito Sans, all-caps, wide tracking) ---- */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-amethyst);
}
.eyebrow-muted {
  color: var(--color-muted);
  opacity: 0.7;
}

/* ---- Body / paragraph ---- */
p, .p {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--color-fg-1);
}
.p-lead {
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  color: var(--color-fg-1);
}
.p-muted {
  color: var(--color-fg-2);
}
.p-small {
  font-size: var(--fs-sm);
  color: var(--color-fg-2);
}

/* ---- Labels / UI text ---- */
.label {
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: 0.02em;
}
.label-strong {
  font-weight: 700;
}
.caption {
  font-family: var(--font-body);
  font-size: var(--fs-xs);
  color: var(--color-fg-2);
  letter-spacing: 0.02em;
}

/* ---- Numeric / price ---- */
.price {
  font-family: var(--font-body);
  font-size: var(--fs-2xl);
  font-weight: 700;
  color: var(--color-fg-1);
  letter-spacing: -0.01em;
}
.price-original {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  color: var(--color-fg-2);
  text-decoration: line-through;
}

/* ---- Decorative "luminous" gradient text — used sparingly ---- */
.luminous-text {
  background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-lavender) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

/* ---- Links ---- */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out-soft);
}
a.link {
  color: var(--color-link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a.link:hover { color: var(--color-link-hover); }

/* ---- Utility surfaces ---- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}
.container-narrow {
  width: 100%;
  max-width: var(--container-narrow);
  margin: 0 auto;
  padding: 0 var(--container-pad);
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-md);
}

/* ---- Focus ring — accessibility ---- */
:focus-visible {
  outline: 2px solid var(--color-amethyst);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

:root {
  /* ----------------------------------------------------------------
     COLOR — Brand
     ---------------------------------------------------------------- */
  --color-amethyst:        #5B3A7A;   /* primary brand purple — buttons, links, accents */
  --color-amethyst-deep:   #4A3065;   /* hover state for amethyst, deeper variant */
  --color-amethyst-ink:    #3A2550;   /* pressed / text on cream when more weight needed */
  --color-lavender:        #DCC9F0;   /* soft lavender — badges, hover tints, photography */
  --color-lavender-soft:   #F8F3FA;   /* very pale lavender — icon circles, hover bg */
  --color-lavender-mist:   #EFE6F8;   /* mid-tint, section backgrounds */
  --color-beige:           #D8C3A5;   /* warm sand — secondary, dot inactive */
  --color-beige-soft:      #EFE7D9;   /* warm tint, optional accent surfaces */

  /* ----------------------------------------------------------------
     COLOR — Neutrals
     ---------------------------------------------------------------- */
  --color-cream:           #FAF9F6;   /* primary "soft-white" background */
  --color-cream-warm:      #F5F1EA;   /* warmer cream, for layered surfaces */
  --color-white:           #FFFFFF;   /* pure white — cards, modals */
  --color-soft-white:      #F8F9FA;   /* alt soft surface */
  --color-charcoal:        #1F1B24;   /* darkest text, also footer bg */
  --color-charcoal-2:      #2D2D2D;   /* secondary charcoal (per brand spec) */

   Trust strip — horizontal marquee
   ============================================================ */
.trust-strip{
  background:var(--color-ink);color:#fff;
  padding:22px 0;overflow:hidden;
  border-top:1px solid var(--color-amethyst);
  border-bottom:1px solid var(--color-amethyst);
}
.trust-track{
  display:flex;gap:64px;
  animation:trust-scroll 38s linear infinite;
  white-space:nowrap;
  align-items:center;
}
@keyframes trust-scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
.trust-item{
  display:inline-flex;align-items:center;gap:14px;
  font-family:var(--font-heading);font-style:italic;font-weight:400;
  font-size:22px;color:#fff;letter-spacing:-0.01em;
}
.trust-item .num{
  font-family:var(--font-body);font-style:normal;font-weight:800;
  font-size:14px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--color-lavender);
}
.trust-item .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--color-amethyst);
}

/* ============================================================
   II — Benefit Grid (editorial spread)
   ============================================================ */
.diff-section{padding:120px 0;background:var(--color-paper);position:relative}
.diff-head{
  display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:72px;
}
@media (min-width:900px){
  .diff-head{grid-template-columns:1fr 1.4fr;gap:64px;align-items:end}
}
.diff-title{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(2.4rem,5vw,4.5rem);line-height:0.95;letter-spacing:-0.025em;
  color:var(--color-ink);
}
.diff-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}
.diff-sub{
  font-size:15px;line-height:1.7;color:var(--color-ink);opacity:0.7;max-width:440px;
}

.diff-mosaic{
  display:grid;
  grid-template-columns:1fr;
  gap:24px;
}
@media (min-width:760px){
  .diff-mosaic{
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:160px;
    gap:24px;
  }
}

.diff-cell{
  position:relative;
  background:#fff;
  padding:28px;
  display:flex;flex-direction:column;justify-content:space-between;gap:18px;
  border:1px solid var(--color-rule);
  transition:transform 320ms ease, box-shadow 320ms ease;
  min-height:200px;
}
.diff-cell:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(91,58,122,0.08)}
.diff-cell .cell-num{
  font-family:var(--font-heading);font-style:italic;font-weight:400;
  font-size:14px;color:var(--color-amethyst);letter-spacing:0.04em;
}
.diff-cell .cell-num .ns{
  font-family:var(--font-body);font-style:normal;font-weight:700;font-size:10px;
  letter-spacing:0.25em;text-transform:uppercase;color:var(--color-ink);opacity:0.45;margin-right:8px;
}
.diff-cell .cell-title{
  font-family:var(--font-heading);font-weight:500;
  font-size:clamp(1.25rem,1.7vw,1.65rem);line-height:1.1;letter-spacing:-0.015em;
  color:var(--color-ink);
}
.diff-cell .cell-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}
.diff-cell .cell-foot{
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--color-ink);opacity:0.55;
}
.diff-cell .cell-foot svg{width:14px;height:14px;color:var(--color-amethyst);stroke-width:1.5}

/* Image / stat / feature variants */
.diff-cell.is-image{padding:0;overflow:hidden;border:0}
.diff-cell.is-image img{width:100%;height:100%;object-fit:cover}
.diff-cell.is-image::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top, rgba(31,27,36,0.45), transparent 55%);
  pointer-events:none;
}
.diff-cell.is-image .img-cap{
  position:absolute;left:24px;right:24px;bottom:24px;
  color:#fff;z-index:1;
}
.diff-cell.is-image .img-cap .ns{
  display:block;font-size:10px;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;
  opacity:0.85;margin-bottom:6px;color:var(--color-lavender);
}
.diff-cell.is-image .img-cap .it{
  font-family:var(--font-heading);font-style:italic;font-weight:400;font-size:22px;line-height:1.1;
}

.diff-cell.is-stat{
  background:var(--color-amethyst);color:#fff;border-color:var(--color-amethyst);
  justify-content:center;align-items:flex-start;text-align:left;
}
.diff-cell.is-stat .stat-num{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(3.2rem,6vw,5rem);line-height:0.9;letter-spacing:-0.03em;
}
.diff-cell.is-stat .stat-num em{font-style:italic;color:var(--color-lavender)}
.diff-cell.is-stat .stat-label{
  font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;
  opacity:0.85;
}

/* Mosaic placement at desktop */
@media (min-width:760px){
  .diff-cell.c1{grid-column:span 2;grid-row:span 2}
  .diff-cell.c2{grid-column:span 2;grid-row:span 2}
  .diff-cell.c3{grid-column:span 2;grid-row:span 3}
  .diff-cell.c4{grid-column:span 2;grid-row:span 2}
  .diff-cell.c5{grid-column:span 2;grid-row:span 2}
  .diff-cell.c6{grid-column:span 2;grid-row:span 1}
  .diff-cell.c7{grid-column:span 2;grid-row:span 2}
  .diff-cell.c8{grid-column:span 4;grid-row:span 2}
}

/* ============================================================
   III — Before / After (draggable)
   ============================================================ */
.ba-v2{padding:120px 0;background:var(--color-paper-tint);position:relative;overflow:hidden}
.ba-v2-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;
  margin-bottom:56px;
}
.ba-v2-title{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(2.2rem,4.5vw,4rem);line-height:0.95;letter-spacing:-0.025em;
  color:var(--color-ink);max-width:680px;
}
.ba-v2-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}
.ba-v2-meta{
  font-size:13px;line-height:1.6;color:var(--color-ink);opacity:0.65;max-width:300px;
}
.ba-v2-meta strong{color:var(--color-amethyst);font-weight:700;display:block;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:6px}

.ba-stage{
  position:relative;
  display:grid;grid-template-columns:1fr;gap:40px;
}
@media (min-width:900px){.ba-stage{grid-template-columns:1.4fr 1fr;align-items:start;gap:64px}}

.ba-slider{
  position:relative;width:100%;aspect-ratio:4/3;
  overflow:hidden;background:var(--color-ink);
  user-select:none;cursor:ew-resize;
}
.ba-slider img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;
}
.ba-slider-after{clip-path:inset(0 0 0 0)}
.ba-slider-handle{
  position:absolute;top:0;bottom:0;width:2px;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,0.05), 0 8px 28px rgba(0,0,0,0.3);
  pointer-events:none;
}
.ba-slider-knob{
  position:absolute;top:50%;left:0;
  transform:translate(-50%,-50%);
  width:56px;height:56px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
}
.ba-slider-knob svg{width:18px;height:18px;color:var(--color-ink);stroke-width:1.5}
.ba-slider-knob::before,.ba-slider-knob::after{
  content:"";position:absolute;top:50%;width:8px;height:8px;
  border-top:1.5px solid var(--color-ink);
}
.ba-slider-knob::before{left:10px;border-left:1.5px solid var(--color-ink);transform:translateY(-50%) rotate(-45deg)}
.ba-slider-knob::after{right:10px;border-right:1.5px solid var(--color-ink);transform:translateY(-50%) rotate(45deg)}

.ba-tag{
  position:absolute;top:18px;
  font-family:var(--font-body);font-size:10px;font-weight:700;
  letter-spacing:0.3em;text-transform:uppercase;color:#fff;
  padding:6px 12px;background:rgba(31,27,36,0.5);backdrop-filter:blur(6px);
}
.ba-tag-before{left:18px}
.ba-tag-after{right:18px;background:var(--color-amethyst)}

.ba-stories{display:flex;flex-direction:column;gap:0}
.ba-story{
  padding:24px 0;border-bottom:1px solid var(--color-rule);
  display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  cursor:pointer;transition:padding-left 240ms ease;
}
.ba-story:first-child{border-top:1px solid var(--color-rule)}
.ba-story.active{padding-left:24px;background:linear-gradient(to right, rgba(91,58,122,0.06), transparent 80%)}
.ba-story.active .ba-story-num{color:var(--color-amethyst)}
.ba-story.active .ba-story-title{color:var(--color-amethyst)}
.ba-story-left{display:flex;flex-direction:column;gap:8px}
.ba-story-num{
  font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;
  color:var(--color-ink);opacity:0.5;transition:color 220ms;
}
.ba-story-title{
  font-family:var(--font-heading);font-weight:500;
  font-size:clamp(1.2rem,1.6vw,1.6rem);line-height:1.1;letter-spacing:-0.015em;
  color:var(--color-ink);transition:color 220ms;
}
.ba-story-desc{font-size:13px;line-height:1.6;color:var(--color-ink);opacity:0.65;margin-top:6px;max-width:380px}
.ba-story-week{
  font-family:var(--font-heading);font-style:italic;font-weight:400;
  font-size:28px;color:var(--color-amethyst);line-height:1;flex-shrink:0;
}

/* ============================================================
   IV — Comparison
   ============================================================ */
.comp-v2{padding:120px 0;background:var(--color-paper)}
.comp-v2-head{
  display:flex;flex-direction:column;gap:18px;
  margin-bottom:56px;align-items:flex-start;
}
.comp-v2-title{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(2.2rem,4.5vw,4rem);line-height:0.95;letter-spacing:-0.025em;
  color:var(--color-ink);
}
.comp-v2-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}

.comp-tabs{
  display:flex;gap:0;border-top:1px solid var(--color-rule);border-bottom:1px solid var(--color-rule);
  width:100%;overflow:hidden;flex-wrap:wrap;
}
.comp-tab{
  flex:1;min-width:160px;padding:18px 24px;
  font-size:12px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--color-ink);opacity:0.5;text-align:left;
  background:transparent;border-left:1px solid var(--color-rule);
  transition:opacity 220ms, background 220ms, color 220ms;
  position:relative;
}
.comp-tab:first-child{border-left:0}
.comp-tab:hover{opacity:0.9}
.comp-tab.active{opacity:1;color:var(--color-amethyst);background:var(--color-paper-tint)}
.comp-tab .tab-num{
  font-family:var(--font-heading);font-style:italic;font-weight:400;
  font-size:14px;letter-spacing:0.04em;margin-right:10px;
  color:var(--color-amethyst);text-transform:none;
}

.comp-versus{
  margin-top:64px;
  display:grid;grid-template-columns:1fr;gap:0;position:relative;
}
@media (min-width:760px){.comp-versus{grid-template-columns:1fr auto 1fr;align-items:stretch}}

.comp-side{
  display:flex;flex-direction:column;gap:0;
}
.comp-side-img{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--color-paper-tint)}
.comp-side-img img{width:100%;height:100%;object-fit:cover}
.comp-side-body{padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.comp-side-label{
  font-size:11px;font-weight:700;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--color-ink);opacity:0.5;display:flex;align-items:center;gap:10px;
}
.comp-side-label .marker{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;
}
.comp-side.delora .comp-side-label .marker{background:var(--color-amethyst);color:#fff}
.comp-side.other .comp-side-label .marker{background:transparent;color:var(--color-ink);border:1px solid var(--color-ink);opacity:0.5}
.comp-side.delora .comp-side-label{color:var(--color-amethyst);opacity:1}
.comp-side-title{
  font-family:var(--font-heading);font-weight:500;
  font-size:clamp(1.4rem,2vw,1.85rem);line-height:1.1;letter-spacing:-0.015em;color:var(--color-ink);
}
.comp-side-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}
.comp-side.other .comp-side-title{color:var(--color-ink);opacity:0.7}
.comp-side-text{font-size:14px;line-height:1.65;color:var(--color-ink);opacity:0.7}

.comp-vs{
  display:flex;align-items:center;justify-content:center;
  padding:0 24px;position:relative;
}
.comp-vs::before{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--color-rule);
}
.comp-vs-mark{
  font-family:var(--font-heading);font-style:italic;font-weight:400;
  font-size:64px;color:var(--color-amethyst);line-height:1;
  background:var(--color-paper);padding:18px 6px;position:relative;z-index:1;
}
@media (max-width:759px){
  .comp-vs{padding:24px 0}
  .comp-vs::before{top:50%;left:0;right:0;bottom:auto;width:auto;height:1px}
  .comp-vs-mark{padding:6px 18px}
}

/* ============================================================
   V — How To Use (timeline)
   ============================================================ */
.how-v2{padding:120px 0;background:var(--color-ink);color:#fff;position:relative;overflow:hidden}
.how-v2 .chapter{color:var(--color-lavender)}
.how-v2 .chapter-name{color:#fff;opacity:0.65}
.how-v2 .chapter-rule{background:rgba(255,255,255,0.12)}

.how-v2-title{
  font-family:var(--font-heading);font-weight:300;color:#fff;
  font-size:clamp(2.4rem,5vw,4.5rem);line-height:0.95;letter-spacing:-0.025em;
  max-width:820px;margin-bottom:80px;
}
.how-v2-title em{font-style:italic;color:var(--color-lavender);font-weight:400}

.how-timeline{
  display:flex;flex-direction:column;gap:0;
}
.how-step{
  display:grid;grid-template-columns:1fr;gap:24px;
  padding:48px 0;border-bottom:1px solid rgba(255,255,255,0.10);
  align-items:center;
}
.how-step:first-child{border-top:1px solid rgba(255,255,255,0.10)}
@media (min-width:900px){
  .how-step{grid-template-columns:140px 1fr 1.1fr;gap:64px;padding:56px 0}
}
.how-step-num{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(4rem,9vw,8rem);line-height:0.9;letter-spacing:-0.04em;
  color:#fff;opacity:0.92;
}
.how-step-num em{font-style:italic;color:var(--color-lavender);font-weight:400}
.how-step-body{display:flex;flex-direction:column;gap:14px;max-width:480px}
.how-step-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;
  color:var(--color-lavender);
}
.how-step-title{
  font-family:var(--font-heading);font-weight:500;
  font-size:clamp(1.5rem,2.5vw,2.25rem);line-height:1.1;letter-spacing:-0.015em;color:#fff;
}
.how-step-title em{font-style:italic;color:var(--color-lavender);font-weight:400}
.how-step-desc{font-size:15px;line-height:1.7;color:rgba(255,255,255,0.72)}
.how-step-img{
  position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;
  background:var(--color-amethyst);
}
.how-step-img img{width:100%;height:100%;object-fit:cover;transition:transform 600ms ease}
.how-step:hover .how-step-img img{transform:scale(1.04)}
.how-step-img-tag{
  position:absolute;bottom:14px;left:14px;
  font-family:var(--font-heading);font-style:italic;font-weight:400;
  font-size:14px;color:#fff;letter-spacing:0.02em;
  padding:6px 12px;background:rgba(31,27,36,0.6);backdrop-filter:blur(6px);
}

/* ============================================================
   VI — Reviews
   ============================================================ */
.rev-v2{padding:120px 0;background:var(--color-paper-warm)}
.rev-head{
  display:grid;grid-template-columns:1fr;gap:28px;margin-bottom:64px;align-items:end;
}
@media (min-width:900px){.rev-head{grid-template-columns:1.4fr 1fr;gap:64px}}

.rev-title{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(2.4rem,5vw,4.5rem);line-height:0.95;letter-spacing:-0.025em;color:var(--color-ink);
}
.rev-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}
.rev-aggregate{
  display:flex;flex-direction:column;gap:8px;
  padding:24px 28px;background:#fff;border:1px solid var(--color-rule);
}
.rev-aggregate-num{
  font-family:var(--font-heading);font-weight:500;font-size:64px;line-height:0.9;letter-spacing:-0.025em;
  color:var(--color-amethyst);
}
.rev-aggregate-num em{font-style:italic;font-weight:400}
.rev-aggregate-num .of5{font-size:18px;color:var(--color-ink);opacity:0.5;margin-left:8px}
.rev-aggregate-stars{display:flex;gap:3px;color:var(--color-rating)}
.rev-aggregate-stars svg{width:18px;height:18px}
.rev-aggregate-meta{font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-ink);opacity:0.6}

.rev-featured{
  background:var(--color-ink);color:#fff;padding:56px;margin-bottom:48px;
  display:grid;grid-template-columns:1fr;gap:36px;align-items:center;
  position:relative;overflow:hidden;
}
@media (min-width:900px){.rev-featured{grid-template-columns:1.4fr 1fr;gap:64px;padding:72px}}
.rev-featured::before{
  content:"\201C";position:absolute;top:-32px;left:24px;
  font-family:var(--font-heading);font-weight:300;font-size:220px;line-height:1;
  color:var(--color-amethyst);opacity:0.4;
}
.rev-featured-quote{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(1.5rem,2.6vw,2.4rem);line-height:1.25;letter-spacing:-0.015em;
  color:#fff;position:relative;z-index:1;
}
.rev-featured-quote em{font-style:italic;color:var(--color-lavender);font-weight:400}
.rev-featured-meta{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.rev-featured-stars{display:flex;gap:3px;color:var(--color-rating)}
.rev-featured-stars svg{width:18px;height:18px}
.rev-featured-author{
  font-family:var(--font-heading);font-weight:500;font-size:22px;color:#fff;letter-spacing:-0.01em;
}
.rev-featured-loc{font-size:12px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-lavender)}

.rev-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:680px){.rev-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.rev-grid{grid-template-columns:repeat(3,1fr)}}

.rev-card{
  background:#fff;padding:28px;
  border:1px solid var(--color-rule);
  display:flex;flex-direction:column;gap:16px;
  transition:transform 320ms ease, box-shadow 320ms ease;
}
.rev-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(91,58,122,0.08)}
.rev-card-stars{display:flex;gap:3px;color:var(--color-rating)}
.rev-card-stars svg{width:14px;height:14px}
.rev-card-text{
  font-family:var(--font-heading);font-weight:400;font-style:italic;
  font-size:18px;line-height:1.4;letter-spacing:-0.005em;
  color:var(--color-ink);flex-grow:1;
}
.rev-card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--color-rule)}
.rev-card-name{font-size:13px;font-weight:700;color:var(--color-ink);letter-spacing:0.02em}
.rev-card-verified{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--color-success);letter-spacing:0.05em;
}
.rev-card-verified svg{width:12px;height:12px;stroke-width:2.5}

/* ============================================================
   VII — FAQ
   ============================================================ */
.faq-v2{padding:120px 0;background:var(--color-paper)}
.faq-v2-head{
  display:grid;grid-template-columns:1fr;gap:28px;margin-bottom:56px;
}
@media (min-width:900px){.faq-v2-head{grid-template-columns:1fr 1.4fr;gap:64px;align-items:end}}

.faq-v2-title{
  font-family:var(--font-heading);font-weight:300;
  font-size:clamp(2.4rem,5vw,4.5rem);line-height:0.95;letter-spacing:-0.025em;color:var(--color-ink);
}
.faq-v2-title em{font-style:italic;color:var(--color-amethyst);font-weight:400}
.faq-v2-help{
  padding:20px 24px;background:var(--color-paper-tint);
  display:flex;flex-direction:column;gap:10px;

    const r = el.getBoundingClientRect();
    const p = ((clientX - r.left) / r.width) * 100;
    setPct(Math.max(2, Math.min(98, p)));
  };
  const start = (e)=>{drag.current=true;move(e.touches?e.touches[0].clientX:e.clientX)};
  const stop = ()=>{drag.current=false};
  const onMove = (e)=>{if(!drag.current)return;move(e.touches?e.touches[0].clientX:e.clientX)};

  React.useEffect(()=>{
    window.addEventListener("mouseup",stop);window.addEventListener("touchend",stop);
    window.addEventListener("mousemove",onMove);window.addEventListener("touchmove",onMove,{passive:true});
    return ()=>{window.removeEventListener("mouseup",stop);window.removeEventListener("touchend",stop);
      window.removeEventListener("mousemove",onMove);window.removeEventListener("touchmove",onMove)};
  },[]);

  const r = stories[idx];

  return (
    <section className="ba-v2" id="results">
      <div className="shell">
        <Chapter num="II." name="Les preuves · Доказателствата"/>

        <div className="ba-v2-head" style={{marginTop:24}}>
          <h2 className="ba-v2-title">
            Дръпни плъзгача.<br/>Виж <em>разликата</em>.
          </h2>
          <div className="ba-v2-meta">
            <strong>Прозрачни резултати</strong>
            Всяка снимка е реална, без ретуш — направена в края на препоръчания курс при същото осветление.
          </div>
        </div>

        <div className="ba-stage">
          <div
            className="ba-slider"
            ref={stageRef}
            onMouseDown={start}
            onTouchStart={start}
          >
            <img src={r.before} alt={`Преди — ${r.title}`}/>
            <img src={r.after} alt={`След — ${r.title}`} className="ba-slider-after" style={{clipPath:`inset(0 0 0 ${pct}%)`}}/>
            <span className="ba-tag ba-tag-before">ПРЕДИ</span>
            <span className="ba-tag ba-tag-after">СЛЕД · {r.week}</span>
            <div className="ba-slider-handle" style={{left:`${pct}%`}}></div>
            <div className="ba-slider-knob" style={{left:`${pct}%`}}></div>
          </div>

          <div className="ba-stories">
            {stories.map((s,i)=>(
              <div key={i} className={`ba-story ${i===idx?"active":""}`} onClick={()=>setIdx(i)}>
                <div className="ba-story-left">
                  <div className="ba-story-num">№ 0{i+1}</div>

                  {i===idx && <div className="ba-story-desc">{s.desc}</div>}
                </div>
                <div className="ba-story-week">{s.week}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}
